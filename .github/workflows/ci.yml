name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ZebraLegacy.sln
      - run: dotnet build ZebraLegacy.sln -c Release --no-restore
      - run: dotnet test ZebraLegacy.sln -c Release --no-build --filter "TestCategory!=Integration" --logger "console;verbosity=normal"
      - run: dotnet format ZebraLegacy.sln --verify-no-changes --no-restore
